<kx-lab-layout
  [lab]="lab"
  [demos]="demos"
  [atual]="atual()"
  [valores]="valores()"
  [codigo]="codigo()"
  linguagem="JavaScript"
  (executar)="executar()"
  (reiniciar)="reiniciar()"
  (mudou)="alterar($event.param, $event.valor)"
  (aplicar)="aplicar($event)"
>
  <div palco #palco class="palco">
    @switch (atual().id) {
      @case ('stroke') {
        <svg class="v-svg" viewBox="0 0 300 160" role="img" aria-label="Traço sendo desenhado">
          <defs>
            <linearGradient id="v-grad" x1="0" x2="1">
              <stop offset="0" stop-color="#ff2bd6" />
              <stop offset="1" stop-color="#22e3ff" />
            </linearGradient>
          </defs>
          <path class="v-guia" d="M20,110 C50,20 80,20 95,80 S130,150 150,80 S190,10 210,70 S250,140 280,40" />
          <path class="v-assinatura" d="M20,110 C50,20 80,20 95,80 S130,150 150,80 S190,10 210,70 S250,140 280,40" />
        </svg>
      }
      @case ('mascara') {
        <svg class="v-svg" viewBox="0 0 300 200" role="img" aria-label="Logo revelada por uma máscara">
          <defs>
            <mask id="v-mascara">
              <circle class="v-furo" cx="150" cy="100" r="0" fill="#fff" />
            </mask>
          </defs>
          <rect class="v-moldura" x="1" y="1" width="298" height="198" rx="16" />
          <g mask="url(#v-mascara)">
            <rect width="300" height="200" rx="16" fill="#140c2a" />
            <image href="brand/kalixto-logo-256.webp" x="70" y="20" width="160" height="160" />
          </g>
        </svg>
      }
      @case ('morph') {
        <svg class="v-svg v-svg--quadrado" viewBox="0 0 200 200" role="img" aria-label="Forma se transformando">
          <defs>
            <linearGradient id="v-grad2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff2bd6" />
              <stop offset="1" stop-color="#8b5cf6" />
            </linearGradient>
          </defs>
          <path class="v-forma" [attr.d]="circulo" />
        </svg>
      }
      @case ('filtros') {
        <svg class="v-svg" viewBox="0 0 320 140" role="img" aria-label="Texto distorcido por filtro">
          <defs>
            <filter id="v-onda" x="-10%" y="-20%" width="120%" height="140%">
              <feTurbulence class="v-ruido" type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" />
              <feDisplacementMap class="v-deslocar" in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G" />
            </filter>
          </defs>
          <text class="v-texto" x="160" y="88" text-anchor="middle" filter="url(#v-onda)">KALIXTO</text>
        </svg>
      }
      @case ('motion-path') {
        <svg class="v-svg" viewBox="0 0 320 180" role="img" aria-label="Objeto percorrendo um caminho">
          <path class="v-trilha" d="M20,150 C60,20 120,20 150,90 S240,170 300,30" />
          <g class="v-foguete">
            <path d="M0,-12 L10,10 L0,5 L-10,10 Z" />
          </g>
        </svg>
      }
    }
  </div>
</kx-lab-layout>
