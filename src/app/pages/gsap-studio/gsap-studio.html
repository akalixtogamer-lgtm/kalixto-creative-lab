<kx-lab-layout
  [lab]="lab"
  [demos]="demos"
  [atual]="atual()"
  [valores]="valores()"
  [codigo]="codigo()"
  linguagem="JavaScript"
  (executar)="executar()"
  (reiniciar)="reiniciar()"
  (mudou)="alterar($event.param, $event.valor)"
  (aplicar)="aplicar($event)"
>
  <div palco #palco class="palco">
    @switch (atual().id) {
      @case ('to') {
        <div class="g-caixa">GSAP</div>
      }
      @case ('from') {
        <div class="g-texto">
          <p class="g-titulo">Olá, GSAP!</p>
          <p class="g-sub">gsap.from() traz os elementos para o lugar</p>
        </div>
      }
      @case ('fromto') {
        <div class="g-caixa g-caixa--ciano">K</div>
      }
      @case ('timeline') {
        <div class="g-trilhas">
          <div class="g-trilha"><span class="g-forma g-circulo"></span></div>
          <div class="g-trilha"><span class="g-forma g-quadrado"></span></div>
          <div class="g-trilha"><span class="g-forma g-triangulo"></span></div>
        </div>
      }
      @case ('stagger') {
        <div class="g-grade">
          @for (p of pontos; track p) {
            <span class="g-ponto"></span>
          }
        </div>
      }
      @case ('easing') {
        <div class="g-easing">
          <svg class="g-curva" [attr.viewBox]="'0 0 ' + grafico.largura + ' ' + grafico.altura" role="img"
            [attr.aria-label]="'Gráfico da curva ' + ease()">
            <line class="g-curva-guia" [attr.x1]="grafico.margem" [attr.x2]="grafico.largura - grafico.margem"
              [attr.y1]="linhaZero" [attr.y2]="linhaZero" />
            <line class="g-curva-guia" [attr.x1]="grafico.margem" [attr.x2]="grafico.largura - grafico.margem"
              [attr.y1]="linhaUm" [attr.y2]="linhaUm" />
            <path class="g-curva-linha" [attr.d]="curva()" />
            <circle class="g-curva-ponto" r="6" [attr.cx]="inicioCurva.x" [attr.cy]="inicioCurva.y" />
          </svg>
          <code class="g-ease-nome">{{ ease() }}</code>
          <div class="g-trilho"><span class="g-bola"></span></div>
        </div>
      }
      @case ('reproducao') {
        <div class="g-player">
          <div class="g-player__cena"><div class="g-card">K</div></div>
          <div class="g-player__barra">
            <div class="g-player__botoes" role="group" aria-label="Controles do player">
              <button type="button" class="kx-btn kx-btn--ghost" (click)="play()" aria-label="Play">
                <kx-icon name="play" /> Play
              </button>
              <button type="button" class="kx-btn kx-btn--ghost" (click)="pause()">❚❚ Pause</button>
              <button type="button" class="kx-btn kx-btn--ghost" (click)="reverse()">
                <kx-icon name="arrow-left" /> Reverse
              </button>
              <button type="button" class="kx-btn kx-btn--ghost" (click)="restart()">
                <kx-icon name="reset" /> Restart
              </button>
            </div>
            <label class="g-player__progresso">
              <span class="sr-only">Progresso da timeline</span>
              <input type="range" min="0" max="1" step="0.001" [value]="progresso()"
                (input)="buscar($any($event.target).value)" />
              <output>{{ (progresso() * 100).toFixed(0) }}%</output>
            </label>
          </div>
        </div>
      }
    }
  </div>
</kx-lab-layout>
