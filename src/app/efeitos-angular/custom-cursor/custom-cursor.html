<div
  class="cursor"
  aria-hidden="true"
  [class.is-ativo]="ativo()"
  [class.is-sobre]="sobreClicavel()"
>
  <span #anel class="cursor__anel"></span>
  <span #ponto class="cursor__ponto"></span>
</div>

  <h1>Passe o mouse aqui</h1>

  <button type="button">Um botão</button>
</main>
