<div class="cena">
  <article
    #card
    class="card"
    tabindex="0"
    [class.is-ativo]="ativo()"
    [style.--rx]="rx()"
    [style.--ry]="ry()"
    [style.--s]="ativo() ? escala : null"
    [style.--x]="x()"
    [style.--y]="y()"
    (pointermove)="mover($event)"
    (pointerleave)="sair()"
  >
    <h2>Card 3D</h2>
    <p>Passe o mouse sobre o card.</p>
  </article>
</div>
